name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 仅当推送 0.3 开头且 -cn 结尾的标签时运行（如 0.3.16.4-cn），发布为 pre-release 并更新 cn 分支的 testing 配置
on:
  push:
    tags:
      - '0.3.*-cn'

permissions:
  contents: write

jobs:
  Release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ktisis/
        shell: bash
    env:
      DALAMUD_HOME: /tmp/dalamud
      IsCI: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Library
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
          unzip /tmp/dalamud.zip -d /tmp/dalamud

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build plugin in release mode
        run: dotnet build -c Release --no-restore --nologo -o ./bin/Release

      - name: Generate Checksums
        working-directory: Ktisis/bin/Release/Ktisis
        run: |
          sha512sum latest.zip >> checksums.sha512

      - name: Create GitHub Release (Pre-release)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Ktisis/bin/Release/Ktisis/latest.zip
            Ktisis/bin/Release/Ktisis/checksums.sha512
          prerelease: true
          append_body: true
          body_path: .github/release-notices.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release Artifacts
          path: |
            Ktisis/bin/Release/Ktisis/latest.zip
            Ktisis/bin/Release/Ktisis/checksums.sha512

      - name: Update repo.json (testing on cn branch)
        run: |
          cd ..
          git fetch origin cn
          git checkout cn

          release_version=$(echo ${{ github.ref_name }} | sed 's/-cn$//')
          repo_url="https://meowrs.com/$(echo ${{ github.server_url }}/${{ github.repository }} | sed 's/#/\\#/g')"

          sed -i repo.json -E \
              -e 's#"TestingAssemblyVersion": "([0-9]*\.){2,3}[0-9]*"#"TestingAssemblyVersion": "'"$release_version"'"#g' \
              -e 's#"DownloadLinkTesting": "[^"]*"#"DownloadLinkTesting": "'"$repo_url/releases/download/${{ github.ref_name }}/latest.zip"'"#g'

          git add repo.json
          git config --local user.name "github-actions [bot]"
          git config --local user.email "github-actions@users.noreply.github.com"
          git commit -m "Update repo.json testing for ${{ github.ref_name }}" || true
          git push origin HEAD:cn

  trigger_workflow:
    needs: Release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflow in DalamudPlugin Repository
        run: |
          repo_owner="MeowZWR"
          repo_name="DalamudPlugin"
          event_type="request-update-run-action"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MEOWRSTRIGGER }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"unit\": false, \"integration\": true}}"
